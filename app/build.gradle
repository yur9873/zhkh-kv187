plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.zhkh.kv187'
    compileSdk 34

    defaultConfig {
        applicationId "ru.zhkh.kv187"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
